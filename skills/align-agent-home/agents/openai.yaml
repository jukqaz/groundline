interface:
  display_name: "Align Agent Home"
  short_description: "Audit Codex project and home surfaces"
  default_prompt: "Use $align-agent-home to audit this project's Codex guidance, worktree readiness, plugins, skills, MCP, rules, hooks, and model posture; preserve official capabilities and propose only evidence-backed changes."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "Official OpenAI developer documentation"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
