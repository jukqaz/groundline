[package]
name = "groundline-desktop"
version = "0.24.3"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/jukqaz/groundline"

[workspace]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-opener = "2"
groundline-runtime = { version = "0.24.3", path = "../../../crates/groundline-runtime", features = ["insights-state"] }
xtask = { version = "0.24.3", path = "../../../xtask" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10.3"
zeroize = "1.9.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.26.0", features = ["v4"] }
tempfile = "3.23.0"
url = "2.5.8"
sha2 = "0.10.9"
semver = "1"
dirs = "6"

[profile.release]
lto = "thin"
strip = true
