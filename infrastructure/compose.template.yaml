            "options": {"cellHeight": "sm", "showHeader": true},
            "targets": [{"datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "editorType": "sql", "format": 1, "queryType": "table", "rawSql": "SELECT dimension, value, count() AS installation_count FROM (SELECT 'os_family' AS dimension, os_family AS value FROM groundline.collectors FINAL WHERE revoked = 0 UNION ALL SELECT 'runtime_family' AS dimension, runtime_family AS value FROM groundline.collectors FINAL WHERE revoked = 0 UNION ALL SELECT 'execution_mode' AS dimension, execution_mode AS value FROM groundline.collectors FINAL WHERE revoked = 0 UNION ALL SELECT 'groundline_version' AS dimension, groundline_version AS value FROM groundline.collectors FINAL WHERE revoked = 0) GROUP BY dimension, value ORDER BY dimension, installation_count DESC, value", "refId": "A"}],
            "title": "설치 분포 (registry·설치 기준)",
            "type": "table"
