          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Install-weighted fleet coverage. Never-reported installations are split into a 24-hour initial grace window and overdue; observed installations outside the 7-day recent window are stale. current_package_claim is only the registry's latest-package claim; current_observed/reporting/recent require an accepted event at the policy latest version. Unknown and legacy metadata are not zero or a negative claim.",
            "fieldConfig": {"defaults": {}, "overrides": []},
            "gridPos": {"h": 6, "w": 24, "x": 0, "y": 4},
            "id": 15,
            "options": {"cellHeight": "sm", "showHeader": true},
            "targets": [{"datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "editorType": "sql", "format": 1, "queryType": "table", "rawSql": "WITH policy AS (SELECT argMax(latest_version, updated_at) AS latest_version FROM groundline.release_policy FINAL WHERE policy_key = 'stable'), enrolled AS (SELECT collector_id, created_at, enrollment_schema_version, os_family, runtime_family, execution_mode, groundline_version FROM groundline.collectors FINAL WHERE revoked = 0), any_events AS (SELECT collector_id, toUInt8(1) AS has_report, max(received_at) AS last_seen FROM groundline.basic_active GROUP BY collector_id), reporting_events AS (SELECT collector_id, toUInt8(1) AS has_report FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY collector_id), current_events AS (SELECT events.collector_id, events.received_at, ifNull(events.period_end, events.generated_at) AS event_time FROM groundline.basic_active AS events CROSS JOIN policy WHERE events.groundline_version = policy.latest_version), current_observed AS (SELECT collector_id, toUInt8(1) AS has_report, max(received_at) AS last_seen FROM current_events GROUP BY collector_id), current_reporting AS (SELECT collector_id, toUInt8(1) AS has_report FROM current_events WHERE $$__timeFilter(event_time) GROUP BY collector_id) SELECT (SELECT latest_version FROM policy) AS policy_latest_version, count() AS enrolled_installation_count, countIf(enrollment_schema_version = 2 AND os_family != 'unknown' AND runtime_family != 'unknown' AND execution_mode != 'unknown' AND groundline_version != 'unknown') AS metadata_known_installation_count, countIf(enrollment_schema_version != 2 OR os_family = 'unknown' OR runtime_family = 'unknown' OR execution_mode = 'unknown' OR groundline_version = 'unknown') AS metadata_unknown_installation_count, countIf(ifNull(any_events.has_report, 0) = 1) AS observed_installation_count, countIf(ifNull(reporting_events.has_report, 0) = 1) AS reporting_installation_count, countIf(ifNull(any_events.has_report, 0) = 1 AND any_events.last_seen >= now('UTC') - INTERVAL 7 DAY) AS recent_installation_count, countIf(ifNull(any_events.has_report, 0) = 0) AS never_reported_installation_count, countIf(ifNull(any_events.has_report, 0) = 0 AND enrolled.created_at > now('UTC') - INTERVAL 24 HOUR) AS pending_initial_report_installation_count, countIf(ifNull(any_events.has_report, 0) = 0 AND enrolled.created_at <= now('UTC') - INTERVAL 24 HOUR) AS overdue_never_reported_installation_count, countIf(ifNull(any_events.has_report, 0) = 1 AND any_events.last_seen < now('UTC') - INTERVAL 7 DAY) AS stale_observed_installation_count, countIf(enrolled.groundline_version = (SELECT latest_version FROM policy)) AS current_package_claim_installation_count, countIf(enrolled.groundline_version = (SELECT latest_version FROM policy) AND ifNull(current_observed.has_report, 0) = 0) AS current_package_claim_unobserved_installation_count, countIf(ifNull(current_observed.has_report, 0) = 1) AS current_observed_installation_count, countIf(ifNull(current_reporting.has_report, 0) = 1) AS current_reporting_installation_count, countIf(ifNull(current_observed.has_report, 0) = 1 AND current_observed.last_seen >= now('UTC') - INTERVAL 7 DAY) AS current_recent_installation_count FROM enrolled LEFT JOIN any_events USING (collector_id) LEFT JOIN reporting_events USING (collector_id) LEFT JOIN current_observed USING (collector_id) LEFT JOIN current_reporting USING (collector_id)", "refId": "A"}],
            "title": "설치 coverage (등록 설치 기준)",
            "type": "table"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Enrollment metadata completeness, independent of reporting. Unknown is the v1-compatible default and is not inferred from hostnames, paths, or secrets.",
            "fieldConfig": {"defaults": {}, "overrides": []},
