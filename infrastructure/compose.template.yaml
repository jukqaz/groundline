                "queryType": "table",
                "rawSql": "SELECT $$__timeInterval(ifNull(period_end, generated_at)) AS week_utc_monday, sum(verification_tool_calls) AS verification_calls, sum(verification_success_count) AS success, sum(verification_failure_count) AS failure, sum(verification_unresolved_count) AS unresolved, round(sum(verification_success_count) / nullIf(sum(verification_success_count + verification_failure_count), 0), 4) AS success_ratio_of_resolved, round(sum(verification_success_count + verification_failure_count) / nullIf(sum(verification_tool_calls), 0), 4) AS outcome_coverage FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY week_utc_monday ORDER BY week_utc_monday",
                "refId": "A"
              }
