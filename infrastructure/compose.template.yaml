name: groundline-insights

services:
  clickhouse:
    image: __CLICKHOUSE_IMAGE__
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: groundline
      CLICKHOUSE_USER: groundline_ingest
      CLICKHOUSE_PASSWORD: "__CLICKHOUSE_PASSWORD__"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      GROUNDLINE_GRAFANA_READER_PASSWORD: "__GRAFANA_READER_PASSWORD__"
    volumes:
      - type: bind
        source: "__DATASET_ROOT__/clickhouse"
        target: /var/lib/clickhouse
    configs:
      - source: clickhouse_limits
        target: /etc/clickhouse-server/config.d/groundline-limits.xml
      - source: clickhouse_grafana_user
        target: /etc/clickhouse-server/users.d/groundline-grafana.xml
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 4g
    cpus: 2
    networks:
      - data

  api:
    image: __INSIGHTS_API_IMAGE__
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      GROUNDLINE_LISTEN_HOST: 0.0.0.0
      GROUNDLINE_LISTEN_PORT: "8080"
      GROUNDLINE_CLICKHOUSE_URL: http://clickhouse:8123
      GROUNDLINE_CLICKHOUSE_DATABASE: groundline
      GROUNDLINE_CLICKHOUSE_USER: groundline_ingest
      GROUNDLINE_CLICKHOUSE_PASSWORD: "__CLICKHOUSE_PASSWORD__"
      GROUNDLINE_ADMIN_TOKEN: "__ADMIN_TOKEN__"
      GROUNDLINE_ENROLLMENT_TOKEN: "__ENROLLMENT_TOKEN__"
      GROUNDLINE_PROXY_TOKEN: "__PROXY_TOKEN__"
      GROUNDLINE_OWNER_ENROLLMENT_ENABLED: "true"
      GROUNDLINE_MINIMUM_SUPPORTED_VERSION: "0.20.0"
      GROUNDLINE_RETENTION_DAYS: "365"
      GROUNDLINE_COLLECTOR_MAX_EVENTS: "4096"
      GROUNDLINE_COLLECTOR_MAX_PAYLOAD_BYTES: "268435456"
      GROUNDLINE_DATASET_MAX_ROWS: "2000000"
      GROUNDLINE_DATASET_MAX_BYTES: "68719476736"
    depends_on:
      clickhouse:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1
    networks:
      - data

  api-ingress:
    image: __NGINX_IMAGE__
    restart: unless-stopped
    user: "101:101"
    read_only: true
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        gateway="$$(ip route show default | awk 'NR == 1 {print $$3}')"
        case "$$gateway" in
          *[!0-9.]*|'') exit 1 ;;
        esac
        cat > /tmp/nginx.conf <<'EOF'
        worker_processes 1;
        pid /tmp/nginx.pid;
        error_log /dev/stderr warn;

        events {
          worker_connections 256;
        }

        http {
          access_log off;
          server_tokens off;
          resolver 127.0.0.11 ipv6=off valid=10s;
          client_body_temp_path /tmp/client_body;
          proxy_temp_path /tmp/proxy;
          fastcgi_temp_path /tmp/fastcgi;
          uwsgi_temp_path /tmp/uwsgi;
          scgi_temp_path /tmp/scgi;
          client_max_body_size 256k;

          server {
            listen 8080;

            location / {
              allow 127.0.0.1;
              allow 100.64.0.0/10;
              allow DOCKER_GATEWAY_MARKER;
              deny all;
              set $$api_upstream api;
              proxy_pass http://$$api_upstream:8080;
              proxy_http_version 1.1;
              proxy_connect_timeout 3s;
              proxy_read_timeout 30s;
              proxy_set_header Connection "";
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For __TAILSCALE_BIND_IP__;
              proxy_set_header X-Forwarded-Proto http;
              proxy_set_header X-GroundLine-Proxy-Token "__PROXY_TOKEN__";
            }
          }
        }
        EOF
        sed -i "s/DOCKER_GATEWAY_MARKER/$$gateway/g" /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
    ports:
      - "__TAILSCALE_BIND_IP__:__INGEST_PORT__:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    cpus: 0.25
    networks:
      - data
      - ingress-host

  grafana-storage-init:
    image: __GRAFANA_IMAGE__
    restart: "no"
    user: "0:0"
    read_only: true
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        chown 472:0 /var/lib/grafana
        chmod 0750 /var/lib/grafana
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: "__DATASET_ROOT__/grafana"
        target: /var/lib/grafana
    network_mode: none
    mem_limit: 64m
    cpus: 0.25

  grafana:
    image: __GRAFANA_IMAGE__
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "__INSIGHTS_ACCESS_URL__/"
      GF_SERVER_DOMAIN: "__INSIGHTS_ACCESS_HOST__"
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SECURITY_ADMIN_USER: groundline-admin
      GF_SECURITY_ADMIN_PASSWORD: "__GRAFANA_ADMIN_PASSWORD__"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_SYNC: __GRAFANA_CLICKHOUSE_PLUGIN__
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GROUNDLINE_GRAFANA_READER_PASSWORD: "__GRAFANA_READER_PASSWORD__"
    volumes:
      - type: bind
        source: "__DATASET_ROOT__/grafana"
        target: /var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/groundline.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/groundline.yaml
      - source: grafana_dashboard
        target: /var/lib/grafana/dashboards/groundline-insights.json
    ports:
      - "__TAILSCALE_BIND_IP__:__DASHBOARD_PORT__:3000"
    depends_on:
      api:
        condition: service_healthy
      grafana-storage-init:
        condition: service_completed_successfully
    mem_limit: 1536m
    cpus: 1.5
    networks:
      - data
      - egress

networks:
  data:
    internal: true
  ingress-host: {}
  egress: {}

configs:
  clickhouse_limits:
    content: |
      <clickhouse>
        <access_control_improvements>
          <settings_constraints_replace_previous>true</settings_constraints_replace_previous>
        </access_control_improvements>
        <max_server_memory_usage_to_ram_ratio>0.25</max_server_memory_usage_to_ram_ratio>
        <mark_cache_size>268435456</mark_cache_size>
        <uncompressed_cache_size>67108864</uncompressed_cache_size>
        <query_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
      </clickhouse>

  clickhouse_grafana_user:
    content: |
      <clickhouse>
        <profiles>
          <groundline_grafana>
            <readonly>1</readonly>
            <max_execution_time>30</max_execution_time>
            <constraints>
              <max_execution_time>
                <min>1</min>
                <max>60</max>
                <changeable_in_readonly/>
              </max_execution_time>
            </constraints>
            <max_result_rows>10000</max_result_rows>
            <result_overflow_mode>break</result_overflow_mode>
          </groundline_grafana>
        </profiles>
        <users>
          <grafana_reader>
            <password from_env="GROUNDLINE_GRAFANA_READER_PASSWORD"/>
            <networks>
              <ip>0.0.0.0/0</ip>
              <ip>::/0</ip>
            </networks>
            <profile>groundline_grafana</profile>
            <quota>default</quota>
            <allow_databases>
              <database>groundline</database>
            </allow_databases>
          </grafana_reader>
        </users>
      </clickhouse>

  grafana_datasource:
    content: |
      apiVersion: 1
      prune: true
      deleteDatasources:
        - name: GroundLine ClickHouse
          orgId: 1
      datasources:
        - name: GroundLine ClickHouse
          uid: groundline-clickhouse
          type: grafana-clickhouse-datasource
          access: proxy
          orgId: 1
          version: 1
          isDefault: true
          editable: false
          jsonData:
            host: clickhouse
            port: 9000
            protocol: native
            username: grafana_reader
            defaultDatabase: groundline
            defaultTable: basic_weekly
            dialTimeout: 5
            queryTimeout: 30
            validateSql: true
            enableRowLimit: false
          secureJsonData:
            password: "$$GROUNDLINE_GRAFANA_READER_PASSWORD"

  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: GroundLine
          orgId: 1
          folder: GroundLine
          folderUid: groundline
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false

  grafana_dashboard:
    content: |
      {
        "annotations": {"list": []},
        "description": "Private GroundLine Basic weekly aggregates. Observational signals only; no causal or billing inference.",
        "editable": false,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "id": null,
        "links": [],
        "liveNow": false,
        "panels": [
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Provider-reported token fields where available. Components are separate signals and are not billing; reasoning may be included in provider output totals.",
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "gridPos": {"h": 8, "w": 16, "x": 0, "y": 24},
            "id": 1,
            "options": {"legend": {"calcs": [], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 0,
                "queryType": "table",
                "rawSql": "SELECT toStartOfWeek(ifNull(period_end, generated_at), 1, 'UTC') AS time, sum(total_tokens) AS root_total, sum(cached_input_tokens) AS cached_input, sum(non_cached_input_tokens) AS non_cached_input, sum(output_tokens) AS output, sum(reasoning_output_tokens) AS reasoning, sum(delegated_total_tokens) AS delegated, sum(guardian_total_tokens) AS guardian FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY time ORDER BY time",
                "refId": "A"
              }
            ],
            "title": "Provider token 구성 (관측값)",
            "type": "timeseries"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "All observed root windows in the selected dashboard period. Sufficiency is evaluated after period aggregation, not per checkpoint.",
            "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
            "gridPos": {"h": 4, "w": 8, "x": 16, "y": 24},
            "id": 2,
            "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "SELECT sum(observed_root_count) AS value FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at))",
                "refId": "A"
              }
            ],
            "title": "관측된 root window",
            "type": "stat"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Cached input divided by input tokens. Missing provider usage remains missing.",
            "fieldConfig": {"defaults": {"decimals": 1, "max": 1, "min": 0, "unit": "percentunit"}, "overrides": []},
            "gridPos": {"h": 4, "w": 8, "x": 16, "y": 28},
            "id": 3,
            "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "SELECT sum(cached_input_tokens) / nullIf(sum(input_tokens), 0) AS value FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at))",
                "refId": "A"
              }
            ],
            "title": "입력 cache 비율",
            "type": "stat"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Normalized workflow signals. Ratios are observational proxies, not defect or causal proof.",
            "fieldConfig": {"defaults": {"decimals": 3}, "overrides": []},
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
            "id": 4,
            "options": {"legend": {"calcs": [], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 0,
                "queryType": "table",
                "rawSql": "SELECT toStartOfWeek(ifNull(period_end, generated_at), 1, 'UTC') AS time, round(sum(compactions) / nullIf(sum(observed_root_count), 0), 4) AS compactions_per_observed_root, round(sum(compactions) / nullIf(sum(task_completed), 0), 4) AS compactions_per_completed_turn, round(sumIf(long_turn_count, capability_latency_completed_count = 1) / nullIf(sumIf(latency_completed_count, capability_latency_completed_count = 1), 0), 4) AS long_turn_ratio, round(sum(calls_in_exact_repeated_groups) / nullIf(sum(tool_call_count), 0), 4) AS repeated_call_ratio, round(sum(nonzero_exit_count + timeout_count + rejected_count) / nullIf(sum(tool_call_count), 0), 4) AS failed_call_ratio, round(sum(verification_tool_calls) / nullIf(sum(tool_call_count), 0), 4) AS verification_call_ratio, round(sum(short_message_count) / nullIf(sum(user_messages_with_text), 0), 4) AS short_message_ratio, round(sum(broad_scope_message_count) / nullIf(sum(user_messages_with_text), 0), 4) AS broad_scope_ratio FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY time ORDER BY time",
                "refId": "A"
              }
            ],
            "title": "Workflow 비율 추세",
            "type": "timeseries"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Event-weighted descriptive period aggregates by schema, OS, runtime, execution mode, and GroundLine version. mean_window_p90_ms is the mean of per-window wall-turn p90 values; it is not a merged percentile or model inference latency. This is not install-weighted fleet coverage.",
            "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "mean_window_p90_ms"}, "properties": [{"id": "unit", "value": "ms"}]}]},
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 51},
            "id": 5,
            "options": {"cellHeight": "sm", "showHeader": true},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "SELECT schema_version, os_family, runtime_family, execution_mode, groundline_version, uniqExact(collector_id) AS collectors, sum(observed_root_count) AS observed_roots, round(sum(total_tokens) / nullIf(sum(task_completed), 0), 0) AS tokens_per_completed_task, round(avgIf(latency_p90_ms, latency_p90_ms IS NOT NULL AND capability_latency_completed_count = 1), 0) AS mean_window_p90_ms, round(sum(cached_input_tokens) / nullIf(sum(input_tokens), 0), 3) AS cache_ratio, round(sum(compactions) / nullIf(sum(observed_root_count), 0), 3) AS compactions_per_observed_root, round(sumIf(long_turn_count, capability_latency_completed_count = 1) / nullIf(sumIf(latency_completed_count, capability_latency_completed_count = 1), 0), 3) AS long_turn_ratio, round(sum(calls_in_exact_repeated_groups) / nullIf(sum(tool_call_count), 0), 3) AS repeated_call_ratio, round(sum(nonzero_exit_count + timeout_count + rejected_count) / nullIf(sum(tool_call_count), 0), 3) AS failed_call_ratio, round(sum(verification_success_count) / nullIf(sum(verification_success_count + verification_failure_count), 0), 3) AS verification_success_ratio, sumIf(boundary_review_root_count, capability_root_boundary_counts = 1) AS boundary_review_roots, sumIf(long_lived_root_count, capability_root_boundary_counts = 1) AS long_lived_roots, sum(fallback_rollout_count + delegated_fallback_rollout_count + guardian_fallback_rollout_count) AS fallback_rollouts FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY schema_version, os_family, runtime_family, execution_mode, groundline_version HAVING sum(observed_root_count) >= 10 ORDER BY observed_roots DESC",
                "refId": "A"
              }
            ],
            "title": "Runtime cohort (최소 10개 root)",
            "type": "table"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Seconds since the newest accepted Basic event across all collectors. N/A means no Basic event has arrived; red begins after eight days. This cannot distinguish Tailnet loss, an offline device, inactivity, a disabled hook, or a service failure.",
            "fieldConfig": {"defaults": {"decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 691200}]}, "unit": "s"}, "overrides": []},
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "id": 6,
            "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "SELECT dateDiff('second', max(received_at), now()) AS value FROM groundline.basic_active",
                "refId": "A"
              }
            ],
            "title": "마지막 수집 경과",
            "type": "stat"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Install-weighted fleet summary. Recent means an accepted event within seven days. Overdue means no accepted event after the 24-hour initial-report grace period. Installation identities are random and are not account, person, or device counts.",
            "fieldConfig": {"defaults": {"decimals": 0}, "overrides": [{"matcher": {"id": "byName", "options": "recent_installation_count"}, "properties": [{"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}]}, {"matcher": {"id": "byName", "options": "overdue_never_reported_installation_count"}, "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]}]},
            "gridPos": {"h": 4, "w": 12, "x": 6, "y": 0},
            "id": 7,
            "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "WITH enrolled AS (SELECT collector_id, created_at FROM groundline.collectors FINAL WHERE revoked = 0), activity AS (SELECT collector_id, toUInt8(1) AS has_report, max(received_at) AS last_seen FROM groundline.basic_active GROUP BY collector_id) SELECT count() AS enrolled_installation_count, countIf(ifNull(activity.has_report, 0) = 1 AND activity.last_seen >= now('UTC') - INTERVAL 7 DAY) AS recent_installation_count, countIf(ifNull(activity.has_report, 0) = 0 AND enrolled.created_at <= now('UTC') - INTERVAL 24 HOUR) AS overdue_never_reported_installation_count FROM enrolled LEFT JOIN activity USING (collector_id)",
                "refId": "A"
              }
            ],
            "title": "Fleet: 등록 / 최근 보고 / 최초 보고 지연",
            "type": "stat"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Completed roots excluded because their runtime originator was unclassified, plus roots admitted through the legacy source fallback. This is a coverage signal, not task content.",
            "fieldConfig": {"defaults": {"decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []},
            "gridPos": {"h": 4, "w": 24, "x": 0, "y": 67},
            "id": 8,
            "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "SELECT sum(originator_unclassified_excluded_root_count + originator_source_fallback_root_count) AS value FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at))",
                "refId": "A"
              }
            ],
            "title": "Runtime 분류 누락",
            "type": "stat"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Active collectors whose newest reported GroundLine version is below the deployed stable release.",
            "fieldConfig": {"defaults": {"decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []},
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "id": 9,
            "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [
              {
                "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
                "editorType": "sql",
                "format": 1,
                "queryType": "table",
