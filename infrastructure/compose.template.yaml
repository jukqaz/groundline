rated_at)) AND ('__all' IN ($${os:sqlstring}) OR os_family IN ($${os:sqlstring})) AND ('__all' IN ($${runtime:sqlstring}) OR runtime_family IN ($${runtime:sqlstring})) AND ('__all' IN ($${version:sqlstring}) OR groundline_version IN ($${version:sqlstring})) AND ('__all' IN ($${install:sqlstring}) OR lower(hex(SHA256(toString(collector_id)))) IN ($${install:sqlstring})) GROUP BY schema_version, os_family, runtime_family, execution_mode, groundline_version HAVING sum(observed_root_count) >= 10 ORDER BY observed_roots DESC", "refId": "A"}],
