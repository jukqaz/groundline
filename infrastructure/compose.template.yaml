                "queryType": "table",
                "rawSql": "WITH current_period AS (SELECT sum(observed_root_count) AS roots, uniqExact(collector_id) AS collectors, arraySort(groupUniqArray(collector_id)) AS collector_scope, sum(unreadable_root_count + root_truncated_count + truncated_count + guardian_incomplete_excluded_count + originator_unclassified_excluded_root_count + originator_source_fallback_root_count + fallback_rollout_count + delegated_fallback_rollout_count + guardian_fallback_rollout_count) AS missing_or_fallback, countIf((observed_root_count > 0 AND usage_source IN ('unavailable', 'unknown')) OR (delegated_count > 0 AND delegated_usage_source IN ('unavailable', 'unknown')) OR (guardian_count > 0 AND guardian_usage_source IN ('unavailable', 'unknown'))) AS usage_missing_events, countIf(capability_latency_completed_count = 0 OR capability_root_boundary_counts = 0 OR (guardian_review_count > 0 AND capability_guardian_workspace_attribution = 0) OR (selection_mode != 'activity_window' AND capability_completed_root_coverage = 0)) AS capability_missing_events, countIf(root_status != 'PASS' OR delegated_status != 'PASS' OR guardian_status != 'PASS') AS component_nonpass_events, arraySort(groupUniqArray(tuple(schema_version, groundline_version, os_family, runtime_family, execution_mode, arrayStringConcat(arrayMap((model, effort) -> concat(model, '|', effort), model_families, efforts), ',')))) AS cohorts FROM groundline.basic_active WHERE ifNull(period_end, generated_at) >= now('UTC') - INTERVAL 7 DAY), previous_period AS (SELECT sum(observed_root_count) AS roots, uniqExact(collector_id) AS collectors, arraySort(groupUniqArray(collector_id)) AS collector_scope, sum(unreadable_root_count + root_truncated_count + truncated_count + guardian_incomplete_excluded_count + originator_unclassified_excluded_root_count + originator_source_fallback_root_count + fallback_rollout_count + delegated_fallback_rollout_count + guardian_fallback_rollout_count) AS missing_or_fallback, countIf((observed_root_count > 0 AND usage_source IN ('unavailable', 'unknown')) OR (delegated_count > 0 AND delegated_usage_source IN ('unavailable', 'unknown')) OR (guardian_count > 0 AND guardian_usage_source IN ('unavailable', 'unknown'))) AS usage_missing_events, countIf(capability_latency_completed_count = 0 OR capability_root_boundary_counts = 0 OR (guardian_review_count > 0 AND capability_guardian_workspace_attribution = 0) OR (selection_mode != 'activity_window' AND capability_completed_root_coverage = 0)) AS capability_missing_events, countIf(root_status != 'PASS' OR delegated_status != 'PASS' OR guardian_status != 'PASS') AS component_nonpass_events, arraySort(groupUniqArray(tuple(schema_version, groundline_version, os_family, runtime_family, execution_mode, arrayStringConcat(arrayMap((model, effort) -> concat(model, '|', effort), model_families, efforts), ',')))) AS cohorts FROM groundline.basic_active WHERE ifNull(period_end, generated_at) >= now('UTC') - INTERVAL 14 DAY AND ifNull(period_end, generated_at) < now('UTC') - INTERVAL 7 DAY) SELECT multiIf(current_period.roots < 10 OR previous_period.roots < 10, 'INSUFFICIENT', current_period.missing_or_fallback > 0 OR previous_period.missing_or_fallback > 0 OR current_period.usage_missing_events > 0 OR previous_period.usage_missing_events > 0 OR current_period.capability_missing_events > 0 OR previous_period.capability_missing_events > 0 OR current_period.component_nonpass_events > 0 OR previous_period.component_nonpass_events > 0, 'INSUFFICIENT', current_period.collector_scope != previous_period.collector_scope OR current_period.cohorts != previous_period.cohorts, 'COHORT_MISMATCH', 'READY') AS comparison_status, previous_period.roots AS baseline_observed_roots, current_period.roots AS candidate_observed_roots, previous_period.collectors AS baseline_collectors, current_period.collectors AS candidate_collectors, previous_period.missing_or_fallback AS baseline_missing_or_fallback, current_period.missing_or_fallback AS candidate_missing_or_fallback, previous_period.usage_missing_events AS baseline_usage_missing_events, current_period.usage_missing_events AS candidate_usage_missing_events, previous_period.capability_missing_events AS baseline_capability_missing_events, current_period.capability_missing_events AS candidate_capability_missing_events, previous_period.component_nonpass_events AS baseline_component_nonpass_events, current_period.component_nonpass_events AS candidate_component_nonpass_events FROM current_period CROSS JOIN previous_period",
