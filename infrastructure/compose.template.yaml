          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Storage and delivery quality for logical events in the selected period. ClickHouse FINAL removes physical retry rows from analysis, but the duplicate excess remains visible. Delayed means over 6 hours, overdue over 24 hours, and clock skew means generated_at is more than 5 minutes ahead of received_at. No automatic OPTIMIZE or deletion is performed.",
            "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
            "gridPos": {"h": 6, "w": 12, "x": 0, "y": 18},
            "id": 18,
            "options": {"cellHeight": "sm", "showHeader": true},
            "targets": [{"datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "editorType": "sql", "format": 1, "queryType": "table", "rawSql": "WITH logical_events AS (SELECT event_id, received_at, generated_at FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at))), active_collectors AS (SELECT collector_id, current_generation FROM groundline.collectors FINAL WHERE revoked = 0), stored_events AS (SELECT events.event_id FROM groundline.basic_weekly AS events INNER JOIN active_collectors AS active ON events.collector_id = active.collector_id AND events.collection_generation = active.current_generation INNER JOIN (SELECT event_id FROM logical_events) AS selected USING (event_id)) SELECT (SELECT count() FROM stored_events) AS stored_event_row_count, (SELECT count() FROM logical_events) AS deduplicated_event_count, stored_event_row_count - deduplicated_event_count AS duplicate_event_row_count, (SELECT countIf(dateDiff('second', generated_at, received_at) > 21600) FROM logical_events) AS delayed_delivery_event_count, (SELECT countIf(dateDiff('second', generated_at, received_at) > 86400) FROM logical_events) AS overdue_delivery_event_count, (SELECT countIf(generated_at > received_at + INTERVAL 5 MINUTE) FROM logical_events) AS clock_skew_event_count, (SELECT count() FROM groundline.basic_quarantined WHERE $$__timeFilter(ifNull(period_end, generated_at))) AS quarantined_event_count", "refId": "A"}],
            "title": "ClickHouse 저장·전송 품질",
            "type": "table"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Physical rows whose configured retention deadline has passed but which remain until a background TTL merge removes them. This is eventual-cleanup pressure, not a request to run OPTIMIZE or a manual deletion.",
            "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
            "gridPos": {"x": 0, "y": 71, "w": 24, "h": 4},
            "id": 19,
            "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
            "targets": [{"datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "editorType": "sql", "format": 1, "queryType": "table", "rawSql": "SELECT count() AS value FROM groundline.basic_retention WHERE expires_at < now('UTC')", "refId": "A"}],
            "title": "ClickHouse TTL 정리 대기 row",
            "type": "stat"
          }
        ,
          {"id": 20, "title": "기기 그룹과 설치 연결", "description": "App/CLI는 같은 Codex home의 무작위 기기 키로 연결됩니다. 키가 없는 설치는 미연결이며 같은 기기로 추정하지 않습니다. 프로필을 복제하면 키도 복제되므로 실제 하드웨어 대수의 증명은 아닙니다.", "type": "table", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "gridPos": {"x": 0, "y": 75, "w": 24, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "rawSql": "SELECT any(os_family) AS os_family,if(device_id IS NULL,'미연결',right(toString(device_id),4)) AS device_group,count() AS installations,groupUniqArray(runtime_family) AS runtimes FROM groundline.collectors FINAL WHERE revoked=0 GROUP BY device_id ORDER BY os_family,device_group", "format": 1, "editorType": "sql", "queryType": "sql"}], "fieldConfig": {"defaults": {"noValue": "관측 없음"}, "overrides": []}, "options": {}},
          {"id": 21, "title": "API 관측 신선도", "description": "API가 60초마다 기록하는 관측입니다. 180초를 넘으면 API→DB 경로를 확인합니다. 노트북 비활동 여부와 독립된 지표입니다.", "type": "stat", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "gridPos": {"x": 0, "y": 82, "w": 8, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "rawSql": "SELECT if(count()=0,NULL,dateDiff('second',max(period_end),now())) AS seconds_since_heartbeat FROM groundline.api_observations FINAL WHERE route='heartbeat'", "format": 1, "editorType": "sql", "queryType": "sql"}], "fieldConfig": {"defaults": {"noValue": "관측 없음", "unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 180}, {"color": "red", "value": 600}]}}, "overrides": []}, "options": {}},
          {"id": 22, "title": "API 요청 결과·처리 시간", "description": "핸들러 응답 생성까지의 시간입니다. 네트워크 전송 시간이나 pooled p95가 아닙니다. 인증 거절·요청 제한·서버 오류를 따로 셉니다. API 종료 직전 미전송 관측은 남지 않을 수 있습니다.", "type": "table", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "gridPos": {"x": 0, "y": 89, "w": 24, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "rawSql": "SELECT route,outcome,sum(requests) AS request_count,sum(duration_us)/nullIf(sum(requests),0)/1000 AS mean_handler_ms,max(max_duration_us)/1000 AS max_handler_ms FROM groundline.api_observations FINAL WHERE $$__timeFilter(period_end) AND route!='heartbeat' GROUP BY route,outcome ORDER BY route,outcome", "format": 1, "editorType": "sql", "queryType": "sql"}], "fieldConfig": {"defaults": {"noValue": "관측 없음"}, "overrides": []}, "options": {}},
          {"id": 23, "title": "수집기 최근 재시도·대기 관측", "description": "인증된 등록 때 보고한 스냅샷입니다. previous_cycle_pending은 직전 수집 주기의 대기량이며 현재 대기량으로 단정하지 않습니다. 통신이 끊긴 동안의 최신 상태는 알 수 없습니다.", "type": "table", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "gridPos": {"x": 0, "y": 96, "w": 24, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "rawSql": "SELECT c.os_family,c.runtime_family,right(toString(c.collector_id),4) AS installation,d.received_at,d.retry_attempts,d.operator_required,d.previous_cycle_pending FROM (SELECT * FROM groundline.collectors FINAL WHERE revoked=0) c LEFT JOIN (SELECT collector_id,toNullable(received_at) AS received_at,toNullable(retry_attempts) AS retry_attempts,toNullable(operator_required) AS operator_required,toNullable(previous_cycle_pending) AS previous_cycle_pending FROM groundline.collector_diagnostics FINAL) d ON c.collector_id=d.collector_id ORDER BY c.os_family,c.runtime_family", "format": 1, "editorType": "sql", "queryType": "sql"}], "fieldConfig": {"defaults": {"noValue": "관측 없음"}, "overrides": []}, "options": {}},
          {"id": 24, "title": "서버 시작·수집 버전 최초 등록", "description": "서버 시작과 인증된 수집 버전 최초 등록을 구분합니다. 첫 수신을 실제 설치 시각으로 바꾸지 않습니다. 이력 수집 이전의 배포는 추정하지 않습니다.", "type": "table", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "gridPos": {"x": 0, "y": 103, "w": 24, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "rawSql": "SELECT occurred_at,kind,version,if(collector_id IS NULL,'server',right(toString(collector_id),4)) AS installation FROM groundline.lifecycle WHERE $$__timeFilter(occurred_at) ORDER BY occurred_at DESC LIMIT 500", "format": 1, "editorType": "sql", "queryType": "sql"}], "fieldConfig": {"defaults": {"noValue": "관측 없음"}, "overrides": []}, "options": {}},
          {"id": 25, "title": "API 관측 전송 미확인 요청", "description": "최대 3회 전송 후 ACK를 확인하지 못한 관측에 포함된 요청 수입니다. 실제 저장 여부는 불명확하며 API 요청 자체의 실패 수가 아닙니다.", "type": "stat", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "gridPos": {"x": 8, "y": 82, "w": 8, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "rawSql": "SELECT if(count()=0,NULL,sum(dropped_requests)) AS unconfirmed_requests FROM groundline.api_observations FINAL WHERE $$__timeFilter(period_end) AND route='heartbeat'", "format": 1, "editorType": "sql", "queryType": "sql"}], "fieldConfig": {"defaults": {"noValue": "관측 없음", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []}, "options": {}}
