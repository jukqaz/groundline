                "editorType": "sql",
                "format": 1,
                "queryType": "table",
                "rawSql": "SELECT schema_version, groundline_version, os_family, runtime_family, execution_mode, selection_mode, collection_trigger, count() AS events, uniqExact(collector_id) AS collectors, sum(observed_root_count) AS observed_roots, sumIf(eligible_root_count, capability_completed_root_coverage = 1) AS eligible_completed_roots, sumIf(selected_root_count, capability_completed_root_coverage = 1) AS selected_completed_roots, round(sumIf(selected_root_count, capability_completed_root_coverage = 1) / nullIf(sumIf(eligible_root_count, capability_completed_root_coverage = 1), 0), 4) AS completed_root_selection_coverage, sum(root_truncated_count) AS root_selection_truncated, sum(truncated_count) AS delegated_guardian_truncated, sum(guardian_incomplete_excluded_count) AS guardian_incomplete_excluded, sum(unreadable_root_count) AS unreadable_roots, sum(originator_unclassified_excluded_root_count) AS unclassified_originator_roots, sum(originator_source_fallback_root_count) AS source_fallback_originator_roots, sum(fallback_rollout_count + delegated_fallback_rollout_count + guardian_fallback_rollout_count) AS usage_fallback_rollouts, countIf((observed_root_count > 0 AND usage_source IN ('unavailable', 'unknown')) OR (delegated_count > 0 AND delegated_usage_source IN ('unavailable', 'unknown')) OR (guardian_count > 0 AND guardian_usage_source IN ('unavailable', 'unknown'))) AS usage_missing_events, countIf(component_nonpass = 1) AS component_nonpass_events, countIf(capability_completed_root_coverage = 1) AS completed_root_coverage_events, countIf(capability_latency_completed_count = 1) AS latency_denominator_events, countIf(capability_root_boundary_counts = 1) AS root_boundary_count_events, countIf(capability_guardian_workspace_attribution = 1) AS guardian_attribution_events, sumIf(boundary_review_root_count, capability_root_boundary_counts = 1) AS boundary_review_roots, sumIf(long_lived_root_count, capability_root_boundary_counts = 1) AS long_lived_roots, sumIf(guardian_workspace_attributed_review_count, capability_guardian_workspace_attribution = 1) AS guardian_workspace_attributed_reviews FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY schema_version, groundline_version, os_family, runtime_family, execution_mode, selection_mode, collection_trigger ORDER BY observed_roots DESC",
                "refId": "A"
