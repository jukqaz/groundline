            "description": "Conservative latest-seven-days versus previous-seven-days gate. READY requires at least ten observed root windows on both sides and identical schema, version, OS/runtime/execution, model-effort signatures, and internal collector set. Collector IDs are compared but never returned. Use the local compare command for an explicitly changed version or effort.",
