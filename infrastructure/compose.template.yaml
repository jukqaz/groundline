            "description": "Install-weighted roster of enrolled installations. It includes metadata for enrolled collectors that have never reported and returns only a four-character random suffix; no hostname, path, secret, or full collector ID is returned. Reporting state is inferred only from the last accepted event: Tailnet loss, an offline device, inactivity, a disabled hook, and a service failure are intentionally not distinguished centrally.",
