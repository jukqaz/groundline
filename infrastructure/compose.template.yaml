ility_root_boundary_counts = 1) AS long_lived_roots, sumIf(guardian_workspace_attributed_review_count, capability_guardian_workspace_attribution = 1) AS guardian_workspace_attributed_reviews FROM groundline.basic_active WHERE $$__timeFilter(ifNull(period_end, generated_at)) GROUP BY schema_version, groundline_version, os_family, runtime_family, execution_mode, selection_mode, collection_trigger ORDER BY observed_roots DESC",
