            "options": {"cellHeight": "sm", "showHeader": true},
            "targets": [{"datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"}, "editorType": "sql", "format": 1, "queryType": "table", "rawSql": "SELECT count() AS enrolled_installation_count, countIf(enrollment_schema_version = 2 AND os_family != 'unknown' AND runtime_family != 'unknown' AND execution_mode != 'unknown' AND groundline_version != 'unknown') AS metadata_known_installation_count, countIf(enrollment_schema_version != 2 OR os_family = 'unknown' OR runtime_family = 'unknown' OR execution_mode = 'unknown' OR groundline_version = 'unknown') AS metadata_unknown_installation_count, countIf(os_family = 'unknown') AS os_metadata_unknown, countIf(runtime_family = 'unknown') AS runtime_metadata_unknown, countIf(execution_mode = 'unknown') AS execution_metadata_unknown, countIf(groundline_version = 'unknown') AS version_metadata_unknown FROM groundline.collectors FINAL WHERE revoked = 0", "refId": "A"}],
            "title": "등록 metadata 누락 (설치 기준)",
            "type": "table"
          },
          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "description": "Install-weighted registry distributions only. Legacy or unknown values remain explicit unknown buckets and are never inferred from hostnames, IP addresses, paths, or accepted-event fallbacks.",
