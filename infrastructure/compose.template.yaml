          {
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "groundline-clickhouse"},
            "interval": "1h",
                    "description": "A success means a verification-classified tool returned without a detected terminal failure. It remains a tool-result proxy, not proof that the product outcome is correct. Points group aggregate windows by period end (generation time when absent), with a minimum one-hour display interval. They do not reconstruct intra-window activity.",
            "fieldConfig": {"defaults": {}, "overrides": []},
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
