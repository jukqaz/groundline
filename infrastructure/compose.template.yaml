                "rawSql": "WITH enrolled AS (SELECT collector_id, created_at, os_family, runtime_family, execution_mode, groundline_version FROM groundline.collectors FINAL WHERE revoked = 0), latest_by_collector AS (SELECT collector_id, toUInt8(1) AS has_report, argMax(os_family, received_at) AS reported_os, argMax(runtime_family, received_at) AS reported_runtime, argMax(execution_mode, received_at) AS reported_execution, argMax(groundline_version, received_at) AS reported_version, max(received_at) AS reported_last_seen FROM groundline.basic_active GROUP BY collector_id), policy AS (SELECT argMax(latest_version, updated_at) AS latest_version, argMax(minimum_supported_version, updated_at) AS minimum_supported_version FROM groundline.release_policy FINAL WHERE policy_key = 'stable') SELECT right(toString(enrolled.collector_id), 4) AS install_code, lower(hex(SHA256(toString(enrolled.collector_id)))) AS install_key, if(enrolled.os_family = 'unknown' AND ifNull(latest_by_collector.has_report, 0) = 1, ifNull(reported_os, 'unknown'), enrolled.os_family) AS os, if(enrolled.runtime_family = 'unknown' AND ifNull(latest_by_collector.has_report, 0) = 1, ifNull(reported_runtime, 'unknown'), enrolled.runtime_family) AS runtime, if(enrolled.execution_mode = 'unknown' AND ifNull(latest_by_collector.has_report, 0) = 1, ifNull(reported_execution, 'unknown'), enrolled.execution_mode) AS execution, if(enrolled.groundline_version = 'unknown' AND ifNull(latest_by_collector.has_report, 0) = 1, ifNull(reported_version, 'unknown'), enrolled.groundline_version) AS installed_version, latest_version, if(ifNull(latest_by_collector.has_report, 0) = 1, reported_last_seen, NULL) AS last_seen, multiIf(ifNull(latest_by_collector.has_report, 0) = 0 AND created_at > now('UTC') - INTERVAL 24 HOUR, '초기 보고 대기', ifNull(latest_by_collector.has_report, 0) = 0, '최초 보고 지연', last_seen >= now('UTC') - INTERVAL 1 DAY, '최근 보고', last_seen >= now('UTC') - INTERVAL 8 DAY, '보고 지연', 'Tailnet/수집 확인 필요') AS reporting_status, multiIf(ifNull(latest_by_collector.has_report, 0) = 0 OR installed_version IN ('', 'unknown'), '미확인', tuple(toUInt32OrZero(splitByChar('.', installed_version)[1]), toUInt32OrZero(splitByChar('.', installed_version)[2]), toUInt32OrZero(splitByChar('.', installed_version)[3])) < tuple(toUInt32OrZero(splitByChar('.', minimum_supported_version)[1]), toUInt32OrZero(splitByChar('.', minimum_supported_version)[2]), toUInt32OrZero(splitByChar('.', minimum_supported_version)[3])), '지원 중단', tuple(toUInt32OrZero(splitByChar('.', installed_version)[1]), toUInt32OrZero(splitByChar('.', installed_version)[2]), toUInt32OrZero(splitByChar('.', installed_version)[3])) < tuple(toUInt32OrZero(splitByChar('.', latest_version)[1]), toUInt32OrZero(splitByChar('.', latest_version)[2]), toUInt32OrZero(splitByChar('.', latest_version)[3])), '업데이트 필요', '최신') AS update_status FROM enrolled LEFT JOIN latest_by_collector USING (collector_id) CROSS JOIN policy ORDER BY reporting_status DESC, last_seen DESC",
