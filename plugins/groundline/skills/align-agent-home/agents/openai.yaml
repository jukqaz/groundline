interface:
  display_name: "Align Agent Home"
  short_description: "Audit Codex guidance and maintain skill sources"
  default_prompt: "Use $align-agent-home to audit Codex guidance and maintain imported skills with source comparison and relevant tests; preserve local changes, official capabilities, and user settings."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "Official OpenAI developer documentation"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
