interface:
  display_name: "Align Agent Home"
  short_description: "Install or verify GroundLine; repair scoped Codex settings"
  default_prompt: "Use $align-agent-home to inspect or carry out the GroundLine installation, verification, or Codex settings repair I requested. Preserve existing choices and verify only the affected path."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "Official OpenAI developer documentation"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
