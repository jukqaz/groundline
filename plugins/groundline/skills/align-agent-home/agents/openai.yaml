interface:
  display_name: "Align Agent Home"
  short_description: "Apply GroundLine and repair evidenced setup mistakes"
  default_prompt: "Use $align-agent-home to apply GroundLine, inspect existing Codex settings and active guidance against current official model instructions, back up and repair evidenced mistakes within this request, and verify the result while preserving intentional user choices."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "Official OpenAI developer documentation"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
