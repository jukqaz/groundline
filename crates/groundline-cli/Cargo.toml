[package]
name = "groundline-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "groundline"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
groundline-contracts = { version = "2026.1008.3", path = "../groundline-contracts", features = ["insights"] }
groundline-runtime = { version = "2026.1008.3", path = "../groundline-runtime" }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
groundline-runtime = { version = "2026.1008.3", path = "../groundline-runtime", features = ["insights-state"] }
walkdir.workspace = true
rusqlite.workspace = true
divan.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[bench]]
name = "config_catalog"
harness = false
