[package]
name = "groundline-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["audit", "batch", "efficiency", "version"]
audit = ["dep:chrono", "dep:regex", "dep:serde", "dep:serde_json", "dep:sha2"]
batch = ["dep:serde_json"]
efficiency = ["dep:chrono", "dep:serde_json", "version"]
insights = ["dep:chrono", "dep:serde", "dep:serde_json", "dep:sha2", "dep:uuid", "version"]
integrity = ["dep:hmac", "dep:sha2"]
version = ["dep:semver"]

[dependencies]
chrono = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
uuid = { workspace = true, optional = true }
