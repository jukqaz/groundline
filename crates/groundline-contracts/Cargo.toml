[package]
name = "groundline-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[example]]
name = "audit_benchmark"
required-features = ["audit"]

[features]
default = ["audit", "efficiency", "version"]
audit = ["dep:chrono", "dep:serde", "dep:serde_json", "serde_json/raw_value", "dep:sha2", "dep:regex", "dep:shlex", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_parser", "dep:oxc_span"]
efficiency = ["dep:chrono", "dep:serde", "dep:serde_json", "dep:sha2", "dep:regex", "dep:url", "version"]
insights = ["dep:chrono", "dep:serde", "dep:serde_json", "dep:sha2", "dep:regex", "dep:uuid", "version"]
integrity = ["dep:hmac", "dep:sha2"]
guidance = ["dep:serde", "dep:serde-saphyr"]
version = ["dep:chrono", "dep:semver"]

[dependencies]
chrono = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
oxc_allocator = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }
thiserror.workspace = true
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
