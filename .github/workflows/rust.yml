name: GroundLine Rust
on:
  workflow_dispatch:
    inputs:
      build_release_artifacts:
        description: Build the selected product for all three supported targets
        required: true
        default: false
        type: boolean
      clickhouse_image:
        description: Optional latest-candidate ClickHouse image tag or digest; set all four candidate inputs together
        required: false
        type: string
      nginx_image:
        description: Optional latest-candidate Nginx image tag or digest; set all four candidate inputs together
        required: false
        type: string
      grafana_image:
        description: Optional latest-candidate Grafana image tag or digest; set all four candidate inputs together
        required: false
        type: string
      grafana_clickhouse_plugin:
        description: Optional exact plugin ref or unversioned plugin ID for latest; set all four candidate inputs together
        required: false
        type: string
      release_product:
        description: Qualify or build one independently released product
        required: true
        default: core
        type: choice
        options:
          - core
          - insights
  pull_request:
    paths:
      - .gitattributes
      - .agents/plugins/**
      - .github/actions/**
      - .github/workflows/**
      - .cargo/**
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - deny.toml
      - docs/**
      - infrastructure/**
      - install.sh
      - plugins/**
      - rust-toolchain.toml
      - services/**
      - xtask/**
      - '*.md'
  push:
    tags:
      - core-v*.*.*
      - insights-v*.*.*
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: fast source checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      native_setup: ${{ steps.setup-changes.outputs.needed }}
      product: ${{ steps.release.outputs.product }}
      plugin: ${{ steps.release.outputs.plugin }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select native setup checks for relevant PR changes
        if: github.event_name == 'pull_request'
        id: setup-changes
        run: |
          if git diff --quiet HEAD^ HEAD -- .gitattributes Cargo.toml Cargo.lock crates/groundline-cli crates/groundline-contracts crates/groundline-insights-cli crates/groundline-runtime/src/local_file.rs crates/groundline-runtime/src/insights_state.rs crates/groundline-runtime/src/insights_state plugins/groundline/config install.sh .github/workflows/rust.yml .github/actions/setup-rust-stable; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject an invalid or version-mismatched release tag before expensive work
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^(core|insights)-v[0-9]{4}\.[1-9][0-9]{2,3}\.[1-9][0-9]*$ ]]; then
              echo "release tag must select core or insights explicitly" >&2
              exit 1
            fi
            product="${GITHUB_REF_NAME%%-v*}"
            version="${GITHUB_REF_NAME#*-v}"
          else
            product="$REQUESTED_PRODUCT"
            version=""
          fi
          case "$product" in core) plugin=groundline ;; insights) plugin=groundline-insights ;; *) exit 1 ;; esac
          source_version="$(jq -r .version "plugins/$plugin/.codex-plugin/plugin.json")"
          test -z "$version" || test "$source_version" = "$version"
          {
            echo "product=$product"
            echo "plugin=$plugin"
            echo "version=$source_version"
          } >> "$GITHUB_OUTPUT"
        id: release
        env:
          REQUESTED_PRODUCT: ${{ inputs.release_product || 'core' }}
      - name: Select the moving Rust stable channel
        uses: ./.github/actions/setup-rust-stable
        with:
          components: rustfmt
      - name: Reuse bounded source-check build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: source-checks
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run focused tooling and CLI contracts
        run: |
          cargo test --locked -p xtask --all-targets
          cargo test --locked -p groundline-contracts -p groundline-runtime --lib --all-features
          cargo test --locked -p groundline-cli
          cargo test --locked -p groundline-insights-cli --test cli_contract
      - name: Install and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p .tools
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/actionlint.tar.gz -C .tools actionlint
          .tools/actionlint
  qualification:
    name: full source qualification
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/core-v') || startsWith(github.ref, 'refs/tags/insights-v')
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare one coherent compatibility profile
        id: compatibility
        shell: bash
        env:
          CANDIDATE_CLICKHOUSE_IMAGE: ${{ inputs.clickhouse_image }}
          CANDIDATE_NGINX_IMAGE: ${{ inputs.nginx_image }}
          CANDIDATE_GRAFANA_IMAGE: ${{ inputs.grafana_image }}
          CANDIDATE_GRAFANA_CLICKHOUSE_PLUGIN: ${{ inputs.grafana_clickhouse_plugin }}
        run: |
          profile="$RUNNER_TEMP/groundline-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          populated=0
          for value in \
            "$CANDIDATE_CLICKHOUSE_IMAGE" \
            "$CANDIDATE_NGINX_IMAGE" \
            "$CANDIDATE_GRAFANA_IMAGE" \
            "$CANDIDATE_GRAFANA_CLICKHOUSE_PLUGIN"; do
            if [ -n "$value" ]; then
              populated=$((populated + 1))
            fi
          done
          if [ "$populated" -eq 0 ]; then
            cp infrastructure/compatibility.json "$profile"
          elif [ "$populated" -eq 4 ]; then
            jq --null-input \
              --arg clickhouse "$CANDIDATE_CLICKHOUSE_IMAGE" \
              --arg nginx "$CANDIDATE_NGINX_IMAGE" \
              --arg grafana "$CANDIDATE_GRAFANA_IMAGE" \
              --arg plugin "$CANDIDATE_GRAFANA_CLICKHOUSE_PLUGIN" \
              '{schema_version: 1, profile_name: "latest-candidate", clickhouse_image: $clickhouse, nginx_image: $nginx, grafana_image: $grafana, grafana_clickhouse_plugin: $plugin}' \
              > "$profile"
          else
            echo "all four compatibility candidate inputs must be supplied together" >&2
            exit 1
          fi
          chmod 0600 "$profile"
          echo "path=$profile" >> "$GITHUB_OUTPUT"
        if: needs.fast.outputs.product == 'insights'
      - name: Select the moving Rust stable channel
        uses: ./.github/actions/setup-rust-stable
        with:
          components: clippy
          target: x86_64-unknown-linux-musl
      - name: Install the pinned Ubuntu Noble musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools=1.2.4-2
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
        if: needs.fast.outputs.product == 'insights'
      - name: Reuse bounded source-check build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: source-checks
      - name: Deny vulnerable, unlicensed, or untrusted crates
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz" -o /tmp/cargo-deny.tar.gz
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/groundline-tools"
          tar -xzf /tmp/cargo-deny.tar.gz -C "$RUNNER_TEMP/groundline-tools" --strip-components=1 "${archive}/cargo-deny"
          "$RUNNER_TEMP/groundline-tools/cargo-deny" --version
          "$RUNNER_TEMP/groundline-tools/cargo-deny" --locked --all-features check --show-stats
      - name: Check capability partitions
        run: |
          cargo check --locked -p groundline-contracts --no-default-features
          for feature in audit efficiency insights integrity version; do
            cargo check --locked -p groundline-contracts --no-default-features --features "$feature"
          done
          cargo check --locked -p groundline-runtime --no-default-features
          for feature in insights-client insights-state tailnet-probe; do
            cargo check --locked -p groundline-runtime --no-default-features --features "$feature"
          done
      - name: Validate the release-tested and selected compatibility profiles
        env:
          COMPATIBILITY_PROFILE: ${{ steps.compatibility.outputs.path }}
        run: |
          cargo run --locked -p xtask -- verify-compatibility-profile \
            --profile infrastructure/compatibility.json \
            --json
          cargo run --locked -p xtask -- verify-compatibility-profile \
            --profile "$COMPATIBILITY_PROFILE" \
            --allow-unpinned-dependencies \
            --json
        if: needs.fast.outputs.product == 'insights'
      - name: Start the selected ClickHouse integration service
        id: clickhouse
        shell: bash
        env:
          COMPATIBILITY_PROFILE: ${{ steps.compatibility.outputs.path }}
        run: |
          container="groundline-clickhouse-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="$(jq --raw-output .clickhouse_image "$COMPATIBILITY_PROFILE")"
          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:8123:8123 \
            --env CLICKHOUSE_USER=groundline_test \
            --env CLICKHOUSE_PASSWORD=groundline_test_password \
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            "$image"
          echo "container=$container" >> "$GITHUB_OUTPUT"
          for _attempt in $(seq 1 60); do
            if docker exec "$container" clickhouse-client \
              --user groundline_test \
              --password groundline_test_password \
              --query 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
        if: needs.fast.outputs.product == 'insights'
      - name: Run the portable Rust suite once
        run: cargo test --workspace --all-features --locked
      - name: Exercise the isolated ClickHouse and Grafana integration lane
        env:
          GROUNDLINE_CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          GROUNDLINE_CLICKHOUSE_TEST_USER: groundline_test
          GROUNDLINE_CLICKHOUSE_TEST_PASSWORD: groundline_test_password
          GROUNDLINE_CLICKHOUSE_TEST_ALLOW_MUTATION: 'true'
          GROUNDLINE_CLICKHOUSE_TEST_ALLOW_SCHEMA_RESET: 'true'
        run: cargo test --locked -p groundline-insights-api --lib clickhouse_ -- --ignored --nocapture
        if: needs.fast.outputs.product == 'insights'
      - name: Deny Rust warnings once
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify canonical packages and public source
        run: |
          cargo run --locked -p xtask -- verify-source --root . --json
          cargo run --locked -p xtask -- verify-history --root . --json
      - name: Validate the generic compose template
        env:
          COMPATIBILITY_PROFILE: ${{ steps.compatibility.outputs.path }}
        run: |
          compose_path="$RUNNER_TEMP/groundline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          secrets_path="$RUNNER_TEMP/groundline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-secrets.json"
          cleanup() { rm -f -- "$compose_path" "$secrets_path"; }
          trap cleanup EXIT
          cargo run --locked -p xtask -- render-compose \
            --output "$compose_path" \
            --secrets-file "$secrets_path" \
            --dataset-root /mnt/tank/apps/groundline-insights \
            --require-tailnet --bind-ip 100.64.0.1 \
            --image ghcr.io/jukqaz/groundline-insights-api:ci \
            --compatibility-profile "$COMPATIBILITY_PROFILE" \
            --allow-unpinned-dependencies \
            --access-url https://insights.example.invalid \
            --json
          docker compose -f "$compose_path" config --quiet
        if: needs.fast.outputs.product == 'insights'
      - name: Exercise the rendered ClickHouse, API, and Grafana stack
        shell: bash
        env:
          COMPATIBILITY_PROFILE: ${{ steps.compatibility.outputs.path }}
        run: |
          stack_root="$RUNNER_TEMP/groundline-stack-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose_path="$stack_root/compose.yaml"
          secrets_path="$stack_root/secrets.json"
          dataset_root="$stack_root/data"
          project="groundline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bind_ip="100.127.255.254"
          cleanup() {
            docker compose --project-name "$project" -f "$compose_path" down --volumes --remove-orphans >/dev/null 2>&1 || true
            sudo ip address del "$bind_ip/32" dev lo >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$dataset_root/clickhouse" "$dataset_root/grafana"
          chmod 0750 "$dataset_root/clickhouse" "$dataset_root/grafana"
          sudo ip address add "$bind_ip/32" dev lo
          cargo build --release --locked --bin groundline-insights-api --target x86_64-unknown-linux-musl
          mkdir -p image-context
          cp target/x86_64-unknown-linux-musl/release/groundline-insights-api image-context/groundline-insights-api-amd64
          rustc_release="$(rustc --version --verbose | sed -n 's/^release: //p')"
          musl_packages="$(dpkg-query --show --showformat='${Package}=${Version}\n' musl musl-dev musl-tools | LC_ALL=C sort | paste -sd, -)"
          docker build \
            --file services/insights-api/Dockerfile \
            --build-arg TARGETARCH=amd64 \
            --build-arg "GROUNDLINE_VERSION=$(jq --raw-output .version plugins/groundline-insights/.codex-plugin/plugin.json)" \
            --build-arg "GROUNDLINE_RUSTC_VERSION=$rustc_release" \
            --build-arg "GROUNDLINE_BUILD_PACKAGES=$musl_packages" \
            --tag local/groundline-insights-api:ci \
            .
          cargo run --locked -p xtask -- render-compose \
            --output "$compose_path" \
            --secrets-file "$secrets_path" \
            --dataset-root "$dataset_root" \
            --require-tailnet --bind-ip "$bind_ip" \
            --dashboard-port 13000 \
            --ingest-port 18080 \
            --image local/groundline-insights-api:ci \
            --compatibility-profile "$COMPATIBILITY_PROFILE" \
            --allow-unpinned-dependencies \
            --access-url https://insights.example.invalid \
            --json
          docker compose --project-name "$project" -f "$compose_path" config --quiet
          docker compose --project-name "$project" -f "$compose_path" up --detach --wait --wait-timeout 240
          # Compose can report a running Grafana before its HTTP listener is ready.
          # Use the bounded semantic readiness probe before the one-shot access check.
          cargo run --locked -p xtask --bin groundline-deploy -- verify-stack \
            --api-url "http://$bind_ip:18080/healthz" \
            --grafana-url "http://$bind_ip:13000/api/health" \
            --access-url https://insights.example.invalid \
            --secrets-file "$secrets_path" \
            --json
          unauthenticated_headers="$stack_root/unauthenticated.headers"
          unauthenticated_status="$(curl --silent --show-error \
            --noproxy '*' \
            --connect-timeout 5 \
            --max-time 10 \
            --header 'Host: insights.example.invalid' \
            --dump-header "$unauthenticated_headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "http://$bind_ip:13000/d/groundline-insights/groundline-insights")"
          test "$unauthenticated_status" = "302"
          grep --quiet --ignore-case '^location: .*/login' "$unauthenticated_headers"
        if: needs.fast.outputs.product == 'insights'
      - name: Stop the selected ClickHouse integration service
        if: always() && steps.clickhouse.outputs.container != ''
        env:
          CLICKHOUSE_CONTAINER: ${{ steps.clickhouse.outputs.container }}
        run: docker rm --force "$CLICKHOUSE_CONTAINER"
      - name: Exercise offline operational commands
        run: |
          mkdir -p /tmp/groundline-empty-codex-home
          cargo run --locked --bin "$RELEASE_PLUGIN" -- doctor --plugin-root "plugins/$RELEASE_PLUGIN" --codex-home /tmp/groundline-empty-codex-home --json
        env:
          RELEASE_PLUGIN: ${{ needs.fast.outputs.plugin }}
  native-setup:
    name: setup on ${{ matrix.target }}
    if: github.event_name == 'pull_request' && needs.fast.outputs.native_setup == 'true'
    needs: fast
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            codex_sha256: 341c4a08f9ce1935b3007376dc2a3d50a0a89112930e9a474ae61367218f6e8a
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            codex_sha256: 91e3fafe5ff845a8f685a05d04919146fb30fdc9245af1a42a2f7f239959e90c
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            codex_sha256: af9f5aa6e6662accf9d707cef0d9ca083880a173a9c2b6c22947edb7830e5778
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-setup-${{ matrix.target }}
      - name: Install native musl test linker
        if: contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools=1.2.4-2
          cc_key="CC_${TARGET//-/_}"
          linker_key="CARGO_TARGET_${TARGET^^}_LINKER"
          linker_key="${linker_key//-/_}"
          echo "${cc_key}=musl-gcc" >> "$GITHUB_ENV"
          echo "${linker_key}=musl-gcc" >> "$GITHUB_ENV"
      - name: Verify user ownership, repair, setup, and installer behavior
        run: cargo test --locked -p groundline-cli --target "${{ matrix.target }}" --lib --test config_repair_cli --test improvement_cli --test setup_cli --test install_cli -- --show-output
      - name: Verify native checksum endings for both plugins
        run: |
          cargo test --locked -p groundline-cli --target "${{ matrix.target }}" --test cli_contract provider_smoke
          cargo test --locked -p groundline-insights-cli --target "${{ matrix.target }}" --test cli_contract
      - name: Verify private replacement and cross-process collection stop before release
        run: |
          cargo test --locked -p groundline-runtime --lib --all-features --target "${{ matrix.target }}" local_file::tests -- --show-output
          cargo test --locked -p groundline-runtime --lib --all-features --target "${{ matrix.target }}" collection_stop_tests -- --show-output
          cargo test --locked -p groundline-runtime --lib --all-features --target "${{ matrix.target }}" learning_response::tests -- --show-output
      - name: Verify clean installation with actual Codex
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CODEX_SHA256: ${{ matrix.codex_sha256 }}
        run: |
          runtime_dir="$RUNNER_TEMP/groundline-native-codex"
          mkdir -p "$runtime_dir"
          archive="$runtime_dir/codex.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/openai/codex/releases/download/rust-v0.158.0/codex-${TARGET}.tar.gz" -o "$archive"
          actual_sha=$(openssl dgst -sha256 "$archive")
          test "${actual_sha##* }" = "$CODEX_SHA256"
          tar -xzf "$archive" -C "$runtime_dir"
          cargo build --locked --bin groundline-insights --target "$TARGET"
          native_codex="$runtime_dir/codex-${TARGET}"
          native_insights="$GITHUB_WORKSPACE/target/$TARGET/debug/groundline-insights"
          GROUNDLINE_NATIVE_CODEX="$native_codex" GROUNDLINE_NATIVE_INSIGHTS_BINARY="$native_insights" \
            cargo test --locked -p groundline-cli --target "$TARGET" --test native_install -- --ignored --nocapture
  artifacts:
    name: package ${{ needs.fast.outputs.product }} for ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/core-v') || startsWith(github.ref, 'refs/tags/insights-v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_artifacts)
    needs:
      - fast
      - qualification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the moving Rust stable channel
        uses: ./.github/actions/setup-rust-stable
        with:
          target: ${{ matrix.target }}
      - name: Remap GitHub runner paths from release binaries
        shell: bash
        run: |
          runner_home="$HOME"
          printf 'RUSTFLAGS=--remap-path-prefix=%s=/_groundline --remap-path-prefix=%s=/_cargo_home\n' \
            "$GITHUB_WORKSPACE" "$runner_home" >> "$GITHUB_ENV"
      - name: Install the musl linker
        if: contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools=1.2.4-2
          cc_key="CC_${TARGET//-/_}"
          linker_key="CARGO_TARGET_${TARGET^^}_LINKER"
          linker_key="${linker_key//-/_}"
          echo "${cc_key}=musl-gcc" >> "$GITHUB_ENV"
          echo "${linker_key}=musl-gcc" >> "$GITHUB_ENV"
      - name: Verify setup and installer behavior on each native target
        run: |
          cargo test --locked -p groundline-cli --target "${{ matrix.target }}" --lib --test improvement_cli --test setup_cli --test config_repair_cli --test install_cli
          if [ "$RELEASE_PRODUCT" = insights ]; then
            cargo test --locked -p groundline-insights-cli --target "${{ matrix.target }}" --test cli_contract
          fi
      - name: Verify collection stop across native processes
        run: cargo test --locked -p groundline-runtime --all-features --target "${{ matrix.target }}" collection_stop_tests
        if: env.RELEASE_PRODUCT == 'insights'
      - name: Verify scoped native response ownership on each supported target
        run: cargo test --locked -p groundline-runtime --lib --all-features --target "${{ matrix.target }}" learning_response::tests
        if: env.RELEASE_PRODUCT == 'insights'
      - name: Build the selected release binary and host packager
        run: |
          cargo build --locked -p xtask
          cargo build --release --locked --bin "$RELEASE_PLUGIN" --target "${{ matrix.target }}"
      - name: Build the Linux Insights API from the same moving stable toolchain
        if: env.RELEASE_PRODUCT == 'insights' && contains(matrix.target, 'unknown-linux-musl')
        run: cargo build --release --locked --bin groundline-insights-api --target "${{ matrix.target }}"
      - name: Package and smoke the selected artifact
        shell: bash
        run: |
          target/debug/xtask package-binary --product "$RELEASE_PRODUCT" --target "${{ matrix.target }}" --binary "target/${{ matrix.target }}/release/$RELEASE_PLUGIN" --output "dist/$RELEASE_PRODUCT/${{ matrix.target }}"
          "dist/$RELEASE_PRODUCT/${{ matrix.target }}/$RELEASE_PLUGIN" platform --json
      - name: Stage the integrity-checked Insights API image input
        if: env.RELEASE_PRODUCT == 'insights' && contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          destination="dist/api/$TARGET"
          target/debug/xtask verify-binary-privacy --binary "target/$TARGET/release/groundline-insights-api"
          mkdir -p "$destination"
          cp "target/$TARGET/release/groundline-insights-api" "$destination/groundline-insights-api"
          chmod 0755 "$destination/groundline-insights-api"
          (
            cd "$destination"
            sha256sum groundline-insights-api > groundline-insights-api.sha256
          )
          rustc_release="$(rustc --version --verbose | sed -n 's/^release: //p')"
          rustc_commit="$(rustc --version --verbose | sed -n 's/^commit-hash: //p')"
          musl_packages="$(dpkg-query --show --showformat='${Package}=${Version}\n' musl musl-dev musl-tools | LC_ALL=C sort | paste -sd, -)"
          test -n "$rustc_release"
          test -n "$rustc_commit"
          jq --null-input \
            --arg target "$TARGET" \
            --arg rustc_release "$rustc_release" \
            --arg rustc_commit "$rustc_commit" \
            --arg musl_packages "$musl_packages" \
            '{schema_version:1,target:$target,rustc_release:$rustc_release,rustc_commit:$rustc_commit,musl_packages:$musl_packages}' \
            > "$destination/build-metadata.json"
      - name: Upload one bounded target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groundline-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14
    env:
      RELEASE_PRODUCT: ${{ needs.fast.outputs.product }}
      RELEASE_PLUGIN: ${{ needs.fast.outputs.plugin }}
  publish-release:
    name: publish one versioned product release
    if: startsWith(github.ref, 'refs/tags/core-v') || startsWith(github.ref, 'refs/tags/insights-v')
    needs:
      - fast
      - artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the moving Rust stable channel
        uses: ./.github/actions/setup-rust-stable
      - name: Download the exact target packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: groundline-*
          path: packages
          merge-multiple: true
      - name: Verify and archive the selected package set
        run: |
          cargo run --quiet --locked -p xtask -- release-info --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-info.json"
          test "$(jq -r .product "$RUNNER_TEMP/release-info.json")" = "$RELEASE_PRODUCT"
          test "$(jq -r .version "$RUNNER_TEMP/release-info.json")" = "$RELEASE_VERSION"
          chmod 0755 "packages/$RELEASE_PRODUCT/"{aarch64-apple-darwin,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl}/"$RELEASE_PLUGIN"
          cargo run --locked -p xtask -- verify-package-set --product "$RELEASE_PRODUCT" --root "packages/$RELEASE_PRODUCT" --version "$RELEASE_VERSION" --json
          mkdir release-assets
          for target in aarch64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            tar -czf "release-assets/$RELEASE_PLUGIN-$target.tar.gz" -C "packages/$RELEASE_PRODUCT" "$target"
          done
          cd release-assets
          sha256sum ./*.tar.gz | LC_ALL=C sort > SHA256SUMS
      - name: Attest every versioned binary release asset
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*
      - name: Create the release without replacing published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists; published releases are not replaced" >&2
            exit 1
          fi
          title="$(jq -r .title "$RUNNER_TEMP/release-info.json")"
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$title" --notes "독립 $RELEASE_PRODUCT 릴리스입니다. 다른 제품의 발행·설치·수집 상태를 변경하지 않습니다. 소스·패키지 검증과 실제 업무 효과는 구분합니다."
    env:
      RELEASE_PRODUCT: ${{ needs.fast.outputs.product }}
      RELEASE_PLUGIN: ${{ needs.fast.outputs.plugin }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.fast.outputs.version }}
  publish-image:
    name: publish attested multi-architecture Insights API image
    if: startsWith(github.ref, 'refs/tags/insights-v')
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-insights-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the two target-native API binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: groundline-*-unknown-linux-musl
          path: image-artifacts
          merge-multiple: true
      - name: Verify and stage immutable image inputs
        id: image-inputs
        shell: bash
        run: |
          mkdir -p image-context
          targets=(x86_64-unknown-linux-musl aarch64-unknown-linux-musl)
          architectures=(amd64 arm64)
          for index in "${!targets[@]}"; do
            target="${targets[$index]}"
            architecture="${architectures[$index]}"
            source="image-artifacts/api/$target"
            (
              cd "$source"
              sha256sum --check groundline-insights-api.sha256
            )
            cp "$source/groundline-insights-api" "image-context/groundline-insights-api-$architecture"
          done
          amd64_rustc="$(jq --raw-output .rustc_release image-artifacts/api/x86_64-unknown-linux-musl/build-metadata.json)"
          arm64_rustc="$(jq --raw-output .rustc_release image-artifacts/api/aarch64-unknown-linux-musl/build-metadata.json)"
          test -n "$amd64_rustc"
          test "$amd64_rustc" = "$arm64_rustc"
          amd64_musl="$(jq --raw-output .musl_packages image-artifacts/api/x86_64-unknown-linux-musl/build-metadata.json)"
          arm64_musl="$(jq --raw-output .musl_packages image-artifacts/api/aarch64-unknown-linux-musl/build-metadata.json)"
          test -n "$amd64_musl"
          test "$amd64_musl" = "$arm64_musl"
          echo "rustc-version=$amd64_rustc" >> "$GITHUB_OUTPUT"
          echo "musl-packages=$amd64_musl" >> "$GITHUB_OUTPUT"
      - name: Normalize the strict release version
        id: release
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#insights-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          driver-opts: provenance-add-gha=false
      - name: Launch both downloaded API artifacts before publishing
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for architecture in amd64 arm64; do
            image="local/groundline-insights-api:launch-$architecture"
            docker buildx build --load \
              --platform "linux/$architecture" \
              --file services/insights-api/Dockerfile \
              --build-arg "TARGETARCH=$architecture" \
              --build-arg "GROUNDLINE_VERSION=$RELEASE_VERSION" \
              --tag "$image" .
            # Missing secrets must reach the API's own configuration rejection.
            # Runtime failures (such as a lost executable bit or a restricted
            # custom-app PATH) must fail this gate.
            set +e
            output="$(docker run --rm --platform "linux/$architecture" \
              --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --memory 128m --cpus 1 \
              --env PATH=/usr/bin:/bin \
              "$image" 2>&1)"
            status=$?
            set -e
            test "$status" -eq 1
            test "$output" = 'groundline_insights_api_failed: configuration_rejected'
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: services/insights-api/Dockerfile
          build-args: |
            GROUNDLINE_VERSION=${{ steps.release.outputs.version }}
            GROUNDLINE_RUSTC_VERSION=${{ steps.image-inputs.outputs.rustc-version }}
            GROUNDLINE_BUILD_PACKAGES=${{ steps.image-inputs.outputs.musl-packages }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  promote-stable:
    name: promote the selected product channel
    if: always() && (startsWith(github.ref, 'refs/tags/core-v') || startsWith(github.ref, 'refs/tags/insights-v')) && needs.artifacts.result == 'success' && needs.publish-release.result == 'success' && (startsWith(github.ref, 'refs/tags/core-v') || needs.publish-image.result == 'success')
    needs:
      - fast
      - artifacts
      - publish-release
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the moving Rust stable channel
        uses: ./.github/actions/setup-rust-stable
      - name: Download the selected exact three-target packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: groundline-*
          path: ${{ runner.temp }}/groundline-channel-packages
          merge-multiple: true
      - name: Verify and atomically advance the selected channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          packages="$RUNNER_TEMP/groundline-channel-packages/$RELEASE_PRODUCT"
          chmod 0755 "$packages/"{aarch64-apple-darwin,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl}/"$RELEASE_PLUGIN"
          cargo run --locked -p xtask -- stage-distribution --root . --packages "$packages" --release-tag "$RELEASE_TAG"
          "plugins/$RELEASE_PLUGIN/bin/x86_64-unknown-linux-musl/$RELEASE_PLUGIN" provider-smoke --plugin-root "plugins/$RELEASE_PLUGIN" --require-installed --json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "plugins/$RELEASE_PLUGIN/bin" .agents/plugins/marketplace.json distribution.json
          git commit -m "release: assemble ${RELEASE_TAG} distribution"
          candidate_sha="$(git rev-parse HEAD)"
          cargo run --locked -p xtask -- promote-stable --release-tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --candidate-sha "$candidate_sha" --confirm --json
    env:
      RELEASE_PRODUCT: ${{ needs.fast.outputs.product }}
      RELEASE_PLUGIN: ${{ needs.fast.outputs.plugin }}
