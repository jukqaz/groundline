[workspace]
members = [
  "crates/groundline-cli",
  "crates/groundline-contracts",
  "crates/groundline-insights-api",
  "crates/groundline-insights-cli",
  "crates/groundline-runtime",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.20.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/jukqaz/groundline"

[workspace.dependencies]
aho-corasick = "1.1.5"
axum = { version = "0.8.6", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.58", features = ["derive"] }
command-group = "5.0.1"
dirs = "6.0.0"
futures-util = "0.3.31"
hmac = "0.12.1"
ipnet = "2.12.1"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
semver = "1.0.27"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "0.9.8"
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4", "v5"] }
walkdir = "2.5.0"
zeroize = "1.9.0"

[workspace.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Storage_FileSystem"]

[workspace.dependencies.windows-permissions]
version = "0.2.4"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
