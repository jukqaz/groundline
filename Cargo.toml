[workspace]
members = [
  "crates/groundline-cli",
  "crates/groundline-contracts",
  "crates/groundline-runtime",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jukqaz/groundline"

[workspace.dependencies]
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.58", features = ["derive"] }
dirs = "6.0.0"
regex = "1.12.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tempfile = "3.23.0"
toml = "0.9.8"
walkdir = "2.5.0"

[workspace.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Storage_FileSystem"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
